<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090A">
<title>Claudio</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<!-- 不写的话浏览器每次都会去要 /favicon.ico，控制台留一条 404 -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@100,300;100,500;100,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <button class="brand" id="brand" aria-label="打开个人资料">
    <span class="av" id="brand-av">L</span>
    <span class="wordmark">Claudio</span>
  </button>
  <div class="status">
    <button class="mic" id="float" type="button"
            aria-label="悬浮窗" title="浮到其他应用之上">FLOAT</button>
    <button class="mic" id="mic" type="button" aria-pressed="false"
            aria-label="口播开关" title="口播">MIC</button>
    <span class="led" id="led"></span>
    <span class="lbl" id="status">连接中</span>
  </div>
</header>

<!-- ═══ 电台主视图 ═══ -->
<main class="view substrate" id="view-radio">

  <!-- 签名元素：最大的元素不承担交互 -->
  <section class="clockface">
    <div class="clock" id="clock">--:--</div>
    <div class="slot" id="slot">&nbsp;</div>
    <div class="clock-date" id="clock-date">&nbsp;</div>
    <div class="slot-src" id="slot-src"></div>
  </section>

  <!-- 常驻播放器 -->
  <section class="player" id="player" hidden>
    <div class="player-top">
      <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="np"><span class="np-title" id="np-title"></span></span>
      <span class="transport">
        <button class="tbtn" id="prev" aria-label="上一首">◀◀</button>
        <button class="tbtn on" id="toggle" aria-label="播放或暂停">▶</button>
        <button class="tbtn" id="next" aria-label="下一首">▶▶</button>
        <button class="tbtn cast" id="cast" aria-label="投到设备">⇱</button>
      </span>
    </div>
    <div class="cast-panel" id="cast-panel" hidden></div>
    <div class="scrub">
      <span class="rd rd-live" id="t-now">0:00</span>
      <span class="rail" id="rail"><i id="rail-fill"></i></span>
      <span class="rd" id="t-total">0:30</span>
    </div>
  </section>

  <!-- 队列 -->
  <section id="queue-section" hidden>
    <div class="queue-head">
      <span class="lbl">Queue</span>
      <span class="rd" id="queue-count">0 TRACKS</span>
    </div>
    <div class="queue" id="queue"></div>
  </section>

  <!-- 对话 -->
  <div class="feed" id="feed">
    <div class="intro" id="intro">
      <p>跟我说说你现在想听什么 —— 或者只说你此刻的状态。</p>
    </div>
  </div>

  <!-- 快捷入口常驻。放在对话流里的话，一有历史就会被冲掉，
       页面看上去就没有任何可操作的东西了。 -->
  <div class="quick" id="quick">
    <button class="chip">随便</button>
    <button class="chip">有点累</button>
    <button class="chip">需要专注</button>
    <button class="chip">想哭</button>
  </div>

  <footer class="composer">
    <input id="input" type="text" placeholder="跟 DJ 说点什么…" autocomplete="off">
    <button class="send" id="send" aria-label="发送">↑</button>
  </footer>
</main>

<!-- ═══ 个人资料视图 —— 本质是 user/*.md 的可视化 ═══ -->
<main class="view substrate" id="view-profile" hidden>
  <div class="bar">
    <button class="brand" id="back" aria-label="返回电台">
      <span class="tbtn" aria-hidden="true">◀</span>
      <span class="lbl">Profile</span>
    </button>
    <button class="chip" id="reset">清空会话</button>
  </div>

  <div class="pf-head">
    <span class="av av-lg">L</span>
    <div class="pf-name">listener</div>
    <p class="pf-bio">
      三个 markdown 文件写清楚我听什么、什么时候听、以及我说的话该怎么翻译。
      剩下的交给它。
    </p>
  </div>

  <div class="pf-stats">
    <div class="stat"><b id="s-played">—</b><span class="lbl">Played</span></div>
    <div class="stat"><b id="s-peak">—</b><span class="lbl">Peak Hour</span></div>
    <div class="stat"><b id="s-routines">—</b><span class="lbl">Routines</span></div>
  </div>

  <div class="pf-sec">
    <span class="lbl">口播声音</span>
    <div class="voice-row">
      <select id="voice-pick" class="voice-sel" aria-label="选择口播声音"></select>
      <button class="chip" id="voice-try" type="button">试听</button>
    </div>
    <p class="src-note" id="voice-note"></p>
  </div>

  <div class="pf-sec">
    <span class="lbl">今日节目单</span>
    <div class="pf-list" id="pf-plan">
      <span class="pf-empty">今天还没有排期。</span>
    </div>
    <button class="chip" id="plan-build">排今天的期</button>
  </div>

  <div class="pf-sec">
    <span class="lbl">最近播过</span>
    <div class="pf-list" id="pf-recent">
      <span class="pf-empty">还没有播放记录。</span>
    </div>
  </div>

  <div class="pf-sec">
    <span class="lbl">语料</span>
    <p class="src-note" id="pf-src">
      taste.md · routines.md · mood-rules.md
    </p>
    <p class="pf-empty">
      推荐质量的上限由这三个文件决定。它们在本机，不会被提交。
    </p>
  </div>
</main>

<!-- 悬浮窗的内容。平时藏着，开窗时整块搬进 PiP 文档；关窗再搬回来。
     搬移而不是克隆：这样 els 里的引用和已绑定的监听器全都继续有效。 -->
<div id="mini-host" hidden>
  <div class="mini substrate">
    <!-- 封面压在底下当背景，压暗到不跟文字抢 -->
    <div class="mini-art" id="mini-art"></div>
    <div class="mini-clock" id="mini-clock">--:--</div>
    <div class="mini-slot" id="mini-slot">&nbsp;</div>
    <div class="mini-np" id="mini-np">还没有在播的曲目</div>
    <!-- 频谱。取自真实音频，不是定时动画 -->
    <canvas class="mini-wave" id="mini-wave" width="240" height="28" aria-hidden="true"></canvas>
    <div class="mini-rail" id="mini-rail"><i id="mini-fill"></i></div>
    <div class="mini-tr">
      <button class="tbtn" id="mini-prev" aria-label="上一首">◀◀</button>
      <button class="tbtn on" id="mini-toggle" aria-label="播放或暂停">▶</button>
      <button class="tbtn" id="mini-next" aria-label="下一首">▶▶</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>
<script type="module" src="/app.js"></script>
</body>
</html>
